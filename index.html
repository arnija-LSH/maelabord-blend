<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>Mælaborð BLEND</title>
<style>
  :root {
    --blue: #1F4E79;
    --mid:  #2E75B6;
    --pale: #EBF3FB;
    --ink:  #1a1a2e;
    --muted:#5a6a80;
    --line: #dce6f0;
    --bg:   #f7fafd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
  }

  /* ── HAUS ── */
  header {
    background: var(--blue); color: #fff;
    padding: 10px 16px 0;
    padding-top: max(10px, env(safe-area-inset-top));
    flex-shrink: 0;
  }
  .topline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { flex: 1; min-width: 180px; }
  .brand .eyebrow { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .8px; }
  .brand h1 { font-size: 18px; font-weight: 700; line-height: 1.25; }
  .month label { font-size: 11px; opacity: .75; display: block; text-transform: uppercase; letter-spacing: .6px; }
  .month select {
    font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff;
  }
  .month select option { color: var(--ink); }

  /* ── FLIPAR ── */
  nav {
    display: flex; gap: 2px; margin-top: 10px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex-shrink: 0; color: rgba(255,255,255,.8); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px;
    border-radius: 8px 8px 0 0; white-space: nowrap;
  }
  nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
  nav a[aria-current="page"] { background: var(--bg); color: var(--blue); }

  /* ── MÆLABORÐ ── */
  main { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .tomt { padding: 40px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 520px) {
    /* Þéttari haus í síma svo mælaborðið fái meira pláss */
    .topline { flex-wrap: nowrap; }
    .brand { min-width: 0; }
    .brand .eyebrow, .month label { display: none; }
    .brand h1 { font-size: 16px; }
    .month select { font-size: 12px; padding: 4px 4px; }
    nav a { padding: 8px 11px; font-size: 13px; }
  }
</style>
<script src="data/manudir.js"></script>
</head>
<body>

<header>
  <div class="topline">
    <div class="brand">
      <div class="eyebrow">Landspítali · BLEND</div>
      <h1>Mánaðarleg mælaborð</h1>
    </div>
    <div class="month">
      <label for="manudur">Tímabil</label>
      <select id="manudur"></select>
    </div>
  </div>
  <nav id="flipar" aria-label="Mælaborð"></nav>
</header>

<main id="svaedi"></main>

<script>
  // Mælaborðin sem appið birtir. key = skráarheiti í dashboards/ og í data/<mánuður>/.
  var MAELABORD = [
    { key: 'fjarhagur',  heiti: 'Fjárhagur' },
    { key: 'yfirvinna',  heiti: 'Yfirvinna' },
    { key: 'stodugildi', heiti: 'Stöðugildi' },
    { key: 'lyf',        heiti: 'Lyfjakostnaður' }
  ];

  var listi = window.MANUDIR || [];
  var val = document.getElementById('manudur');
  var flipar = document.getElementById('flipar');
  var svaedi = document.getElementById('svaedi');

  listi.forEach(function (m) {
    var o = document.createElement('option');
    o.value = m.id; o.textContent = m.heiti;
    val.appendChild(o);
  });

  // Staða geymd í slóðinni (#fjarhagur/2026-09) svo hægt sé að deila tengli á tiltekið mælaborð.
  function lesaStodu() {
    var h = location.hash.replace('#', '').split('/');
    var key = MAELABORD.some(function (x) { return x.key === h[0]; }) ? h[0] : MAELABORD[0].key;
    var m = listi.some(function (x) { return x.id === h[1]; }) ? h[1] : (listi.length ? listi[listi.length - 1].id : '');
    return { key: key, m: m };
  }

  function birta() {
    var s = lesaStodu();
    val.value = s.m;
    flipar.innerHTML = '';
    MAELABORD.forEach(function (x) {
      var a = document.createElement('a');
      a.href = '#' + x.key + '/' + s.m;
      a.textContent = x.heiti;
      if (x.key === s.key) a.setAttribute('aria-current', 'page');
      flipar.appendChild(a);
    });
    if (!s.m) { svaedi.innerHTML = '<p class="tomt">Engin gögn fundust í data/manudir.js.</p>'; return; }
    // v= tryggir að vafrinn sæki nýjustu útgáfu mælaborðs og gagna (GitHub Pages leyfir 10 mín. skyndiminni)
    // Nýtt v= í hvert sinn sem skipt er um flipa/tímabil, svo ný útgáfa sjáist án þess að endurhlaða síðuna
    var src = 'dashboards/' + s.key + '.html?m=' + encodeURIComponent(s.m) + '&v=' + Date.now().toString(36);
    var f = svaedi.querySelector('iframe');
    if (!f) { f = document.createElement('iframe'); svaedi.appendChild(f); }
    f.setAttribute('src', src);
    f.title = MAELABORD.filter(function (x) { return x.key === s.key; })[0].heiti;
    var virkur = flipar.querySelector('[aria-current]');
    if (virkur) virkur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  val.addEventListener('change', function () {
    location.hash = lesaStodu().key + '/' + val.value;
  });
  window.addEventListener('hashchange', birta);
  birta();
</script>
</body>
</html>
